services:
  postgres:
    image: postgres:16-alpine
    container_name: alphaagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alphaagent
      POSTGRES_USER: alphaagent
      POSTGRES_PASSWORD: alphaagent
    ports:
      - "5432:5432"
    volumes:
      - alphaagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaagent -d alphaagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alphaagent-postgres-data:
